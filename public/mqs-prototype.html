<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MQS prototype</title>
  <style>
    :root{color-scheme:dark;--bg:#15171b;--panel:#202329;--row:#24282e;--border:#383d45;--muted:#979da8;--text:#f3f4f6;--accent:#7c5cff;--accent2:#a294fc;--danger:#ef4444}
    *{box-sizing:border-box} body{margin:0;background:#111317;color:var(--text);font:14px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
    button,input{font:inherit}.shell{width:min(380px,100%);height:min(720px,92vh);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);border-radius:16px;background:var(--panel);box-shadow:0 24px 80px rgba(0,0,0,.35)}
    .header{height:52px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--border);gap:6px}.title{font-weight:700;font-size:16px}.spacer{flex:1}.icon{width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}.icon:hover,.icon:focus-visible{background:#2b2f36;color:var(--text);outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent)}
    .queue{flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:#747b84 transparent;scroll-padding-top:8px}.history{opacity:.42}.row{display:flex;align-items:center;gap:9px;min-height:56px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.055)}.drag{width:28px;height:34px;border:0;background:transparent;color:#7d848f;border-radius:7px;cursor:grab;font-size:17px}.drag:focus-visible{outline:2px solid var(--accent)}
    .thumb{width:42px;height:42px;border-radius:7px;border:1px solid var(--border);display:grid;place-items:center;flex:none;background:linear-gradient(135deg,#353b45,#20242a);font-weight:800;font-size:10px;color:#cfd3da}.meta{min-width:0;flex:1}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650;font-size:13px}.sub{margin-top:2px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dur{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
    .current{margin:7px 8px;border:1px solid color-mix(in srgb,var(--accent) 62%,transparent);border-radius:12px;background:linear-gradient(180deg,rgba(124,92,255,.10),rgba(124,92,255,.045));box-shadow:0 0 0 1px rgba(124,92,255,.08)}.current .row{border:0;padding:10px}.current .thumb{width:48px;height:48px}.timeline{display:flex;align-items:center;gap:8px;padding:0 10px 10px}.time{width:30px;font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums}.track{position:relative;height:30px;flex:1}.rail{position:absolute;left:0;right:0;top:14px;height:2px;border-radius:99px;background:#3a3f47;overflow:hidden}.fill{height:100%;width:28%;background:var(--accent)}.playhead{position:absolute;left:28%;top:1px;transform:translateX(-50%);width:28px;height:28px;border:0;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(124,92,255,.35)}.playhead:focus-visible{outline:3px solid rgba(162,148,252,.35)}.mute{width:30px;height:30px;border:0;border-radius:7px;background:transparent;color:#c9ced6;cursor:pointer}.mute:hover{background:#2b2f36}
    .composer{border-top:1px solid var(--border);padding:10px;display:grid;grid-template-columns:1fr 38px 38px;gap:6px;background:#202329}.input{height:38px;border-radius:9px;border:1px solid var(--border);background:#191c20;color:var(--text);padding:0 11px;min-width:0}.input:focus{outline:2px solid rgba(124,92,255,.35);border-color:var(--accent)}.add,.upload{height:38px;border-radius:9px;border:1px solid transparent;cursor:pointer}.add{background:var(--accent);color:white;font-size:22px}.add:disabled{opacity:.35;cursor:not-allowed}.upload{background:#272b31;border-color:var(--border);color:#e5e7eb}.error{grid-column:1/-1;color:#fda4af;font-size:10px;min-height:14px}.hint{position:absolute;left:-9999px}
    .menu{position:absolute;right:12px;top:48px;width:190px;border:1px solid var(--border);border-radius:10px;background:#1b1e23;padding:5px;box-shadow:0 14px 40px rgba(0,0,0,.35);display:none;z-index:20}.menu.open{display:block}.menu button{display:block;width:100%;padding:8px 9px;border:0;border-radius:7px;background:transparent;color:var(--text);text-align:left;cursor:pointer}.menu button:hover{background:#2a2e35}.menu .danger{color:#fca5a5}
    .wrap{position:relative}
    @media(max-width:420px){body{padding:0}.shell{border-radius:0;width:100%;height:100vh;border-left:0;border-right:0}.current{margin-left:6px;margin-right:6px}}
  </style>
</head>
<body>
<div class="wrap">
  <section class="shell" aria-label="MQS prototype">
    <header class="header"><div class="title">MQS</div><div class="spacer"></div><button class="icon" id="more" aria-label="More queue actions">•••</button><button class="icon" aria-label="Close">×</button></header>
    <div class="queue" id="queue" tabindex="0" aria-label="Media queue">
      <div id="history" class="history"></div>
      <section class="current" id="current" aria-label="Currently playing">
        <div class="row"><div class="thumb">YT</div><div class="meta"><div class="name">Everlong (Live at the Fuji Rock Festival)</div><div class="sub">YouTube · added by @DJ Kai</div></div><div class="dur">4:10</div></div>
        <div class="timeline"><div class="time">1:12</div><div class="track"><div class="rail"><div class="fill"></div></div><button id="playhead" class="playhead" aria-label="Pause" title="Pause">Ⅱ</button></div><button id="mute" class="mute" aria-label="Mute" title="Mute">🔊</button></div>
      </section>
      <div id="upcoming"></div>
    </div>
    <form class="composer" id="composer"><input class="input" id="url" placeholder="Paste media URL…" aria-label="Media URL" inputmode="url"/><button class="add" id="add" aria-label="Add to queue" disabled>＋</button><button type="button" class="upload" id="upload" aria-label="Upload setlist" title="Upload setlist">⇧</button><input id="file" class="hint" type="file" accept="application/json,.json"/><div id="error" class="error" role="status"></div></form>
  </section>
  <div id="menu" class="menu" role="menu"><button id="shuffle">Shuffle upcoming</button><button id="clear">Clear upcoming</button><button id="stop" class="danger">Stop & clear all</button></div>
</div>
<script>
const historyItems=[['Wake Me Up When September Ends','YouTube · added by @Vic','4:46','GD'],['Smells Like Teen Spirit','YouTube · added by @Mira','5:01','NV'],['Numb','YouTube · added by @DJ Kai','3:07','LP']];
let upcoming=[['The Pretender','YouTube · added by @DJ Kai','4:29','FF'],['Sabotage','YouTube · added by @Mira','2:58','BB'],['B.Y.O.B.','YouTube · added by @Vic','4:15','SO'],['Killing In The Name','YouTube · added by @DJ Kai','5:13','RA'],['Uprising','YouTube · added by @Mira','5:03','MU']];
const history=document.querySelector('#history'),list=document.querySelector('#upcoming'),queue=document.querySelector('#queue'),current=document.querySelector('#current');
function row(item,played=false,index=-1){const el=document.createElement('div');el.className='row';if(!played){const d=document.createElement('button');d.className='drag';d.type='button';d.textContent='⋮⋮';d.title='Reorder with Alt+↑/↓';d.setAttribute('aria-label',`Reorder ${item[0]}`);d.addEventListener('keydown',e=>{if(!e.altKey)return;if(e.key==='ArrowUp'&&index>0){[upcoming[index-1],upcoming[index]]=[upcoming[index],upcoming[index-1]];renderUpcoming();setTimeout(()=>list.querySelectorAll('.drag')[index-1]?.focus())}if(e.key==='ArrowDown'&&index<upcoming.length-1){[upcoming[index+1],upcoming[index]]=[upcoming[index],upcoming[index+1]];renderUpcoming();setTimeout(()=>list.querySelectorAll('.drag')[index+1]?.focus())}});el.appendChild(d)}else{const s=document.createElement('span');s.style.width='28px';el.appendChild(s)}el.innerHTML+=`<div class="thumb">${item[3]}</div><div class="meta"><div class="name">${item[0]}</div><div class="sub">${item[1]}</div></div><div class="dur">${item[2]}</div>`;return el}
function renderHistory(){history.replaceChildren(...historyItems.slice(-3).map(x=>row(x,true)))}
function renderUpcoming(){list.replaceChildren(...upcoming.map((x,i)=>row(x,false,i)))}
renderHistory();renderUpcoming();requestAnimationFrame(()=>{queue.scrollTop=Math.max(0,current.offsetTop-8)});
const playhead=document.querySelector('#playhead');let playing=true;playhead.onclick=()=>{playing=!playing;playhead.textContent=playing?'Ⅱ':'▶';playhead.setAttribute('aria-label',playing?'Pause':'Play');playhead.title=playing?'Pause':'Play'};
const mute=document.querySelector('#mute');let muted=false;mute.onclick=()=>{muted=!muted;mute.textContent=muted?'🔇':'🔊';mute.setAttribute('aria-label',muted?'Unmute':'Mute')};
const input=document.querySelector('#url'),add=document.querySelector('#add'),err=document.querySelector('#error');input.oninput=()=>{add.disabled=!input.value.trim();err.textContent=''};document.querySelector('#composer').onsubmit=e=>{e.preventDefault();const value=input.value.trim();if(!value)return;try{const u=new URL(value);if(!['http:','https:'].includes(u.protocol))throw 0}catch{err.textContent='Use a valid http(s) media URL.';return}upcoming.push([value.includes('youtu')?'New YouTube item':'New media item',`${value.includes('twitch')?'Twitch':'Web'} · added by @You`,'LIVE','NW']);renderUpcoming();input.value='';add.disabled=true;queue.scrollTop=queue.scrollHeight};
const upload=document.querySelector('#upload'),file=document.querySelector('#file');upload.onclick=()=>file.click();file.onchange=async()=>{const f=file.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.segments)||!data.segments.length)throw new Error('A setlist needs at least one segment.');const safe=data.segments.slice(0,500).filter(s=>{try{const u=new URL(String(s.url||''));return ['http:','https:'].includes(u.protocol)}catch{return false}});if(!safe.length)throw new Error('No safe http(s) segments found.');upcoming=safe.map((s,i)=>[String(s.title||'Untitled'),`${String(s.platform||'Web')} · added by @You`,s.duration?`${Math.max(1,Math.round(Number(s.duration)))}m`:'30m','UP']);renderUpcoming();err.textContent=`Loaded ${safe.length} item${safe.length===1?'':'s'}${data.segments.length>500?' (first 500 only)':''}.`}catch(ex){err.textContent=ex?.message||'That file is not valid setlist JSON.'}finally{file.value=''}};
const more=document.querySelector('#more'),menu=document.querySelector('#menu');more.onclick=()=>menu.classList.toggle('open');document.addEventListener('click',e=>{if(!menu.contains(e.target)&&e.target!==more)menu.classList.remove('open')});document.querySelector('#shuffle').onclick=()=>{upcoming=upcoming.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);renderUpcoming();menu.classList.remove('open')};document.querySelector('#clear').onclick=()=>{upcoming=[];renderUpcoming();menu.classList.remove('open')};document.querySelector('#stop').onclick=()=>{if(confirm('Stop playback and clear the queue?')){upcoming=[];renderUpcoming();playing=false;playhead.textContent='▶';playhead.setAttribute('aria-label','Play')}menu.classList.remove('open')};
</script>
</body>
</html>
