name: MQS format once

on:
  push:
    branches:
      - prototype/mqs-final-layout

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Patch final transport layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pages/MqsPrototype.tsx")
          source = path.read_text()

          start = source.index('            <div\n              className="relative h-10"')
          end = source.index('            <span className="justify-self-end', start)
          rail = '''            <div
              className="relative h-10"
              role="slider"
              tabIndex={hasDuration ? 0 : -1}
              aria-label="Playback position"
              aria-valuemin={0}
              aria-valuemax={hasDuration ? duration : 0}
              aria-valuenow={hasDuration ? Math.min(duration, elapsed) : 0}
            >
              <div className="absolute top-1/2 right-0 left-0 h-1 -translate-y-1/2 overflow-hidden rounded-full bg-muted">
                {hasDuration ? (
                  <div
                    className="h-full rounded-full bg-indigo-400"
                    style={{ width: `${progress}%` }}
                  />
                ) : null}
              </div>
              {hasDuration ? (
                <span
                  aria-hidden="true"
                  className="absolute top-1/2 size-3 -translate-x-1/2 -translate-y-1/2 rounded-full bg-indigo-400 ring-4 ring-card"
                  style={{ left: `${progress}%` }}
                />
              ) : null}
            </div>

          '''
          source = source[:start] + rail + source[end:]

          old_controls = '''        <div className="flex flex-col items-center justify-center gap-3 border-l border-border/70 px-4">
          <Button
            type="button"
            variant="ghost"
            size="icon-lg"
            aria-label="Skip up"
            title="Skip up"
            onClick={onSkipUp}
          >
            <ChevronUp />
          </Button>
          <Button
            type="button"
            variant="ghost"
            size="icon-lg"
            aria-label="Skip down"
            title="Skip down"
            onClick={onSkipDown}
          >
            <ChevronDown />
          </Button>
        </div>'''
          new_controls = '''        <div className="flex flex-col items-center justify-center gap-3 border-l border-border/70 px-4">
          <Button
            type="button"
            variant="ghost"
            size="icon-lg"
            aria-label="Skip up"
            title="Skip up"
            onClick={onSkipUp}
          >
            <ChevronUp />
          </Button>
          <Button
            type="button"
            variant="outline"
            size="icon-lg"
            className="rounded-full bg-card"
            aria-label={isPlaying ? "Pause" : "Play"}
            title={isPlaying ? "Pause" : "Play"}
            onClick={onTogglePlaying}
          >
            {isPlaying ? <Pause /> : <Play />}
          </Button>
          <Button
            type="button"
            variant="ghost"
            size="icon-lg"
            aria-label="Skip down"
            title="Skip down"
            onClick={onSkipDown}
          >
            <ChevronDown />
          </Button>
        </div>'''
          if old_controls not in source:
              raise SystemExit("Expected current transport block was not found")
          source = source.replace(old_controls, new_controls, 1)
          path.write_text(source)
          PY
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format MQS files
        run: pnpm exec prettier --write src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/mqs-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts .github/workflows/mqs-format-once.yml
          git commit -m "chore: format final MQS prototype"
          git push origin HEAD:prototype/mqs-final-layout
