name: Apply MQS Drag Remove

on:
  push:
    paths:
      - ".github/workflows/mqs-drag-remove-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VERCEL_ORG_ID: team_fxAj717BuD1hQ9q3PeCu02hC
      VERCEL_PROJECT_ID: prj_dol1AgcBzkQ17lN8zQJ1DOaXCrOA
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply drag-to-remove patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          source_path = Path("src/pages/MqsPrototype.tsx")
          source = source_path.read_text()

          old = '''function Contributor({ name }: { name: string }) {'''
          new = '''function playRemovalPoof(target: HTMLElement) {
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return

            const rect = target.getBoundingClientRect()
            const originX = rect.left + rect.width / 2
            const originY = rect.top + rect.height / 2
            const particles = [
              [-34, -8, 12],
              [-27, -25, 16],
              [-10, -34, 11],
              [10, -31, 14],
              [29, -22, 12],
              [35, -2, 16],
              [27, 20, 11],
              [8, 28, 15],
              [-13, 27, 13],
              [-31, 16, 10],
            ] as const

            particles.forEach(([x, y, size], index) => {
              const particle = document.createElement("span")
              particle.dataset.mqsPoof = "true"
              Object.assign(particle.style, {
                position: "fixed",
                left: `${originX}px`,
                top: `${originY}px`,
                width: `${size}px`,
                height: `${size}px`,
                borderRadius: "9999px",
                background: "rgba(230, 230, 235, 0.4)",
                boxShadow: "0 0 10px rgba(230, 230, 235, 0.16)",
                pointerEvents: "none",
                zIndex: "9999",
              })
              document.body.appendChild(particle)

              const animation = particle.animate(
                [
                  {
                    transform: "translate(-50%, -50%) scale(0.2)",
                    opacity: 0.75,
                    filter: "blur(0px)",
                  },
                  {
                    offset: 0.32,
                    transform: `translate(calc(-50% + ${x * 0.35}px), calc(-50% + ${y * 0.35}px)) scale(1)`,
                    opacity: 0.56,
                    filter: "blur(0.5px)",
                  },
                  {
                    transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(1.55)`,
                    opacity: 0,
                    filter: "blur(2.5px)",
                  },
                ],
                {
                  duration: 420 + index * 12,
                  easing: "cubic-bezier(0.2, 0.75, 0.25, 1)",
                  fill: "forwards",
                }
              )

              void animation.finished.finally(() => particle.remove())
            })
          }

          function Contributor({ name }: { name: string }) {'''
          assert source.count(old) == 1, "Contributor insertion point changed"
          source = source.replace(old, new)

          old = '''  const [stopOpen, setStopOpen] = React.useState(false)
            const fileInputRef = React.useRef<HTMLInputElement>(null)'''
          new = '''  const [stopOpen, setStopOpen] = React.useState(false)
            const [dragSource, setDragSource] = React.useState<string | null>(null)
            const [removeTargetActive, setRemoveTargetActive] = React.useState(false)
            const fileInputRef = React.useRef<HTMLInputElement>(null)
            const removeTargetRef = React.useRef<HTMLDivElement>(null)'''
          assert source.count(old) == 1, "state insertion point changed"
          source = source.replace(old, new)

          old = '''  function handleDragStart(event: React.DragEvent, source: string) {
            event.dataTransfer.effectAllowed = "move"
            event.dataTransfer.setData("text/plain", source)
          }

          function handleDropSource(source: string, targetIndex: number) {'''
          new = '''  function handleDragStart(event: React.DragEvent, source: string) {
            event.dataTransfer.effectAllowed = "move"
            event.dataTransfer.setData("text/plain", source)
            setDragSource(source)
            setRemoveTargetActive(false)
          }

          function removeDraggedSource(source: string) {
            const [kind, rawIndex] = source.split(":")
            const sourceIndex = Number(rawIndex)
            if (!Number.isInteger(sourceIndex)) return false

            if (
              kind === "upcoming" &&
              sourceIndex >= 0 &&
              sourceIndex < upcoming.length
            ) {
              setUpcoming((items) =>
                items.filter((_, itemIndex) => itemIndex !== sourceIndex)
              )
              return true
            }

            if (
              kind === "history" &&
              sourceIndex >= 0 &&
              sourceIndex < played.length
            ) {
              setPlayed((items) =>
                items.filter((_, itemIndex) => itemIndex !== sourceIndex)
              )
              return true
            }

            return false
          }

          function handleRemoveDrop(event: React.DragEvent<HTMLDivElement>) {
            event.preventDefault()
            event.stopPropagation()

            const source =
              event.dataTransfer.getData("text/plain") || dragSource || ""
            const target = removeTargetRef.current
            const removed = removeDraggedSource(source)

            if (removed && target) playRemovalPoof(target)

            setRemoveTargetActive(false)
            setDragSource(null)
          }

          function handleDropSource(source: string, targetIndex: number) {'''
          assert source.count(old) == 1, "drag handler insertion point changed"
          source = source.replace(old, new)

          old = '''    <main className="dark min-h-screen bg-background px-4 py-6 text-foreground sm:px-8 sm:py-10">'''
          new = '''    <main
              className="dark min-h-screen bg-background px-4 py-6 text-foreground sm:px-8 sm:py-10"
              onDragEnd={() => {
                setDragSource(null)
                setRemoveTargetActive(false)
              }}
            >'''
          assert source.count(old) == 1, "main drag-end insertion point changed"
          source = source.replace(old, new)

          old = '''          <div className="relative min-w-0 flex-1">
            <Link2
              className="pointer-events-none absolute top-1/2 left-4 z-10 size-5 -translate-y-1/2 text-muted-foreground"
              aria-hidden="true"
            />
            <Input
              value={url}
              onChange={(event) => {
                setUrl(event.target.value)
                setError(null)
              }}
              onKeyDown={(event) => {
                if (event.key === "Enter") {
                  event.preventDefault()
                  addUrl("tail")
                }
              }}
              aria-label="Media URL"
              placeholder="Paste YouTube or Twitch URL"
              className="h-14 rounded-lg bg-transparent pl-12 text-base"
            />
          </div>'''
          new = '''          <div className="relative min-w-0 flex-1">
            {dragSource ? (
              <div
                ref={removeTargetRef}
                data-testid="remove-drop-target"
                role="status"
                onDragEnter={(event) => {
                  event.preventDefault()
                  setRemoveTargetActive(true)
                }}
                onDragOver={(event) => {
                  event.preventDefault()
                  event.dataTransfer.dropEffect = "move"
                  setRemoveTargetActive(true)
                }}
                onDragLeave={(event) => {
                  const relatedTarget = event.relatedTarget as Node | null
                  if (relatedTarget && event.currentTarget.contains(relatedTarget))
                    return
                  setRemoveTargetActive(false)
                }}
                onDrop={handleRemoveDrop}
                className={cn(
                  "flex h-9 items-center justify-center gap-2 rounded-md border border-destructive/40 bg-destructive/10 px-3 text-xs font-medium text-destructive transition-colors",
                  removeTargetActive &&
                    "border-destructive/70 bg-destructive/20 ring-1 ring-destructive/30"
                )}
              >
                <Trash2 className="size-4" aria-hidden="true" />
                <span>
                  {removeTargetActive ? "Drop here to remove" : "Drop to remove"}
                </span>
              </div>
            ) : (
              <>
                <Link2
                  className="pointer-events-none absolute top-1/2 left-4 z-10 size-5 -translate-y-1/2 text-muted-foreground"
                  aria-hidden="true"
                />
                <Input
                  value={url}
                  onChange={(event) => {
                    setUrl(event.target.value)
                    setError(null)
                  }}
                  onKeyDown={(event) => {
                    if (event.key === "Enter") {
                      event.preventDefault()
                      addUrl("tail")
                    }
                  }}
                  aria-label="Media URL"
                  placeholder="Paste YouTube or Twitch URL"
                  className="h-14 rounded-lg bg-transparent pl-12 text-base"
                />
              </>
            )}
          </div>'''
          assert source.count(old) == 1, "composer replacement point changed"
          source = source.replace(old, new)

          source_path.write_text(source)

          test_path = Path("tests/mqs-prototype.spec.ts")
          tests = test_path.read_text()
          marker = '''  test("previews a setlist and replaces the queue in paused state", async ({'''
          addition = '''  test("turns the media input into a drag-to-remove target", async ({
            page,
          }) => {
            const rows = page.getByTestId("upcoming-row")
            const firstRow = rows.first()
            const mediaInput = page.getByRole("textbox", { name: "Media URL" })
            const dataTransfer = await page.evaluateHandle(() => new DataTransfer())

            await expect(rows).toHaveCount(5)
            await firstRow.dispatchEvent("dragstart", { dataTransfer })

            const removeTarget = page.getByTestId("remove-drop-target")
            await expect(mediaInput).toHaveCount(0)
            await expect(removeTarget).toContainText("Drop to remove")

            await removeTarget.dispatchEvent("dragenter", { dataTransfer })
            await expect(removeTarget).toContainText("Drop here to remove")
            await removeTarget.dispatchEvent("drop", { dataTransfer })

            await expect(rows).toHaveCount(4)
            await expect(page.getByText("Afterlife Tulum 2025")).toHaveCount(0)
            await expect(mediaInput).toBeVisible()
            await expect(page.locator('[data-mqs-poof="true"]')).not.toHaveCount(0)
          })

          ''' + marker
          assert tests.count(marker) == 1, "test insertion point changed"
          tests = tests.replace(marker, addition)
          test_path.write_text(tests)
          PY

      - name: Format changed files
        run: pnpm exec prettier --write src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run MQS browser tests
        run: pnpm exec playwright test tests/mqs-prototype.spec.ts --project=chromium

      - name: Commit feature and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/mqs-drag-remove-once.yml
          git config user.name "Russfranky"
          git config user.email "90220424+russfranky@users.noreply.github.com"
          git add src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts .github/workflows/mqs-drag-remove-once.yml
          git commit -m "feat: drag queue items to remove"
          git push origin HEAD:main

      - name: Pull Vercel project settings
        run: pnpm dlx vercel@59.5.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production bundle
        run: pnpm dlx vercel@59.5.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        run: pnpm dlx vercel@59.5.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
