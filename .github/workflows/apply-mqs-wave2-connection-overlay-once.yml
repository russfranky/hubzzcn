name: Apply MQS Wave 2 Connection Overlay Once

on:
  push:
    branches:
      - feature/mqs-wave2-connection-overlay

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: python scripts/tmp-mqs-wave2-connection-overlay.py
      - run: pnpm exec prettier --write src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts
      - run: pnpm typecheck
      - run: pnpm exec playwright install chromium
      - run: pnpm exec playwright test tests/mqs-prototype.spec.ts --project=chromium

      - name: Commit feature and remove temporary files
        run: |
          rm scripts/tmp-mqs-wave2-connection-overlay.py
          rm .github/workflows/apply-mqs-wave2-connection-overlay-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts scripts .github/workflows
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add MQS reconnecting overlay"
          git push origin HEAD:feature/mqs-wave2-connection-overlay
