name: Audit Normalize

on:
  push:
    branches:
      - audit/institutional-hardening
    paths:
      - .github/audit-normalize-trigger

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: audit/institutional-hardening

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate source-derived artifacts
        run: |
          pnpm registry:sync
          pnpm generate:manifest
          pnpm format

      - name: Commit normalized tree when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Russfranky"
          git config user.email "90220424+russfranky@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tree already normalized."
            exit 0
          fi
          git commit -m "Normalize institutional hardening candidate"
          git push origin HEAD:audit/institutional-hardening
