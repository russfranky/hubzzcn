name: Inspect canonical deployment

on:
  push:
    branches:
      - ops/xyz-deployment-audit

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build canonical bundle
        env:
          VITE_SOURCE_REF: main
        run: pnpm build:preview
      - name: Compare live assets with current source
        run: |
          node --input-type=module <<'JS'
          import { readFile, mkdir, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const base = 'https://hubzz.xyz';
          const extract = html => [...html.matchAll(/(?:src|href)=["']([^"']+\.(?:js|css))["']/g)].map(match => match[1]);
          const html = await (await fetch(`${base}/cn/`, { signal: AbortSignal.timeout(15000) })).text();
          const expected = extract(await readFile('dist/index.html', 'utf8'));
          const actual = extract(html);
          const assets = [];
          for (const asset of actual) {
            const url = new URL(asset, base);
            if (url.origin !== base || !url.pathname.startsWith('/cn/assets/')) throw new Error('Unexpected asset path');
            const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
            const bytes = Buffer.from(await response.arrayBuffer());
            assets.push({ path: asset, status: response.status, sha256: createHash('sha256').update(bytes).digest('hex'), clipboardFix: bytes.includes(Buffer.from('Could not copy command')), queueSemantics: bytes.includes(Buffer.from('Media queue items')) });
          }
          const report = { expected, actual, matchingAssetNames: JSON.stringify(expected) === JSON.stringify(actual), assets };
          console.log(JSON.stringify(report, null, 2));
          await mkdir('canonical-evidence', { recursive: true });
          await writeFile('canonical-evidence/bundle.json', JSON.stringify(report, null, 2));
          JS
      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps
      - name: Inspect canonical routes in Chromium
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch();
          const results = [];
          for (const [name, path] of [['catalog', '/cn/'], ['portal', '/cn/portal'], ['stage', '/cn/stage'], ['mqs', '/cn/?prototype=mqs']]) {
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            try {
              const response = await page.goto(`https://hubzz.xyz${path}`, { waitUntil: 'networkidle', timeout: 30000 });
              await page.screenshot({ path: `canonical-evidence/${name}.png`, fullPage: true });
              const snapshot = await page.locator('body').ariaSnapshot();
              await writeFile(`canonical-evidence/${name}.txt`, snapshot);
              results.push({ name, status: response?.status(), title: await page.title(), url: page.url(), body: (await page.locator('body').innerText()).slice(0, 1800), errors });
            } catch (error) { results.push({ name, error: error.message, errors }); }
            await page.close();
          }
          await browser.close();
          console.log(JSON.stringify(results, null, 2));
          await writeFile('canonical-evidence/browser.json', JSON.stringify(results, null, 2));
          JS
      - name: Save canonical evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-evidence
          path: canonical-evidence/
          retention-days: 7
