name: Apply MQS Passive Drag Grip Once

on:
  push:
    branches:
      - feature/mqs-passive-drag-grip

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/tmp-mqs-passive-drag-grip.py
      - run: pnpm exec prettier --write src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts
      - run: pnpm typecheck
      - run: pnpm exec playwright install chromium
      - run: pnpm exec playwright test tests/mqs-prototype.spec.ts --project=chromium
      - name: Commit feature and remove temporary files
        run: |
          git config user.name "Russfranky"
          git config user.email "90220424+russfranky@users.noreply.github.com"
          git rm scripts/tmp-mqs-passive-drag-grip.py .github/workflows/apply-mqs-passive-drag-grip-once.yml
          git add src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts
          git commit -m "fix: keep MQS drag grips visually passive"
          git push origin HEAD:feature/mqs-passive-drag-grip
