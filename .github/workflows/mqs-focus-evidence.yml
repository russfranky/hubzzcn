name: MQS focus evidence

on:
  push:
    branches:
      - ops/mqs-focus-evidence

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact focus candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 2199a57314e7bac1d5dd0cdd7f934afec5c4d315
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium --with-deps
      - name: Check the production build excludes the fixture
        run: |
          pnpm build:vercel
          mkdir -p focus-evidence
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          const paths = await readdir('dist', { recursive: true });
          assert(!paths.some(path => /tests|fixtures|mqs-focus\.html/.test(path)));
          for (const path of paths.filter(path => /\.(js|html)$/.test(path))) {
            const source = await readFile(`dist/${path}`, 'utf8');
            assert(!source.includes('Controlled focus fixture'));
            assert(!source.includes('apply-snapshot'));
          }
          await writeFile('focus-evidence/production-boundary.json', JSON.stringify({ commit: '2199a57314e7bac1d5dd0cdd7f934afec5c4d315', fixtureExcluded: true, files: paths }, null, 2));
          JS
      - name: Run focused tests without retries
        run: |
          PLAYWRIGHT_JSON_OUTPUT_FILE=focus-evidence/focused.json pnpm exec playwright test tests/mqs-focus.spec.ts tests/mqs-focus-host.spec.ts --project=chromium --retries=0 --reporter=json
      - name: Save focused evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mqs-focus-candidate
          path: |
            focus-evidence/
            test-results/
          retention-days: 7
