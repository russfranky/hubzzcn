name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and registry
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print canonical registry graph formatting
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            scripts/registry-graph.ts \
            scripts/release-registry-refs.ts
          git diff -- \
            scripts/registry-graph.ts \
            scripts/release-registry-refs.ts
          exit 1

      - name: Run repository checks
        run: pnpm check

      - name: Resolve every public registry item at this commit
        shell: bash
        run: |
          set -euo pipefail
          items_file="${RUNNER_TEMP}/hubzz-registry-items"
          pnpm exec tsx scripts/list-registry-items.ts > "$items_file"

          while IFS= read -r item; do
            echo "Resolving ${item}"
            pnpm exec shadcn view "russfranky/hubzzcn/${item}#${GITHUB_SHA}" >/dev/null
          done < "$items_file"

      - name: Install registry into a clean Vite consumer
        run: pnpm registry:smoke "$GITHUB_SHA"

  ui:
    name: Browser and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install supported browsers
        run: pnpm exec playwright install chromium firefox webkit --with-deps

      - name: Run Playwright tests
        run: pnpm test:ui

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
