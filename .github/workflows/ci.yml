name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and registry
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Refresh package boundary state
        run: pnpm install --no-frozen-lockfile

      - name: Verify generated package boundary state
        shell: bash
        run: |
          set -euo pipefail
          pnpm package:deps:check
          pnpm exec prettier --check \
            package.json \
            scripts/check-package-boundary.ts \
            src/main.tsx \
            tsconfig.lib.json \
            vite.config.ts

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add -- pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Expected pnpm to update pnpm-lock.yaml." >&2
            exit 1
          fi
          git -c user.name="Russfranky" \
              -c user.email="90220424+russfranky@users.noreply.github.com" \
              commit -m "Update package boundary lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          exit 1

  ui:
    name: Browser and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install supported browsers
        run: pnpm exec playwright install chromium firefox webkit --with-deps

      - name: Run Playwright tests
        run: pnpm test:ui

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
