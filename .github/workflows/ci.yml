name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and registry
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm check

      - name: Exercise release registry ref pinning
        shell: bash
        run: |
          set -euo pipefail
          test_ref="ci-${GITHUB_SHA}"
          pnpm release:pin-registry "$test_ref"
          pnpm release:verify-registry "$test_ref"

          if git diff --quiet; then
            echo "Expected release pinning to change internal registry dependency refs." >&2
            exit 1
          fi

          git reset --hard HEAD
          git diff --exit-code

      - name: Resolve every public registry item at this commit
        shell: bash
        run: |
          set -euo pipefail
          items_file="${RUNNER_TEMP}/hubzz-registry-items"
          pnpm exec tsx scripts/list-registry-items.ts > "$items_file"

          while IFS= read -r item; do
            echo "Resolving ${item}"
            pnpm exec shadcn view "russfranky/hubzzcn/${item}#${GITHUB_SHA}" >/dev/null
          done < "$items_file"

      - name: Install registry into a clean Vite consumer
        run: pnpm registry:smoke "$GITHUB_SHA"

  ui:
    name: Browser and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install supported browsers
        run: pnpm exec playwright install chromium firefox webkit --with-deps

      - name: Run Playwright tests
        run: pnpm test:ui

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
