name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and registry
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Refresh package boundary state
        run: pnpm install --no-frozen-lockfile

      - name: Print canonical package boundary diff
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            package.json \
            scripts/check-package-boundary.ts \
            src/main.tsx \
            tsconfig.lib.json \
            vite.config.ts
          pnpm package:deps:check
          git diff -- \
            package.json \
            pnpm-lock.yaml \
            scripts/check-package-boundary.ts \
            src/index.css \
            src/main.tsx \
            tsconfig.lib.json \
            vite.config.ts
          exit 1

      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-boundary-lockfile
          path: pnpm-lock.yaml
          retention-days: 1

  ui:
    name: Browser and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install supported browsers
        run: pnpm exec playwright install chromium firefox webkit --with-deps

      - name: Run Playwright tests
        run: pnpm test:ui

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
