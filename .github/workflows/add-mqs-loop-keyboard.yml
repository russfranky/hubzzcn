name: Add MQS loop keyboard support

on:
  push:
    branches:
      - feat/mqs-long-press-loop-clean
    paths:
      - .github/workflows/add-mqs-loop-keyboard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mqs-long-press-loop-clean
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/add_mqs_loop_keyboard.py
      - run: pnpm exec prettier --write src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts
      - name: Commit support and remove helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts
          git rm scripts/add_mqs_loop_keyboard.py .github/workflows/add-mqs-loop-keyboard.yml
          git commit -m "feat: support keyboard Loop hold in MQS"
          git push origin HEAD:feat/mqs-long-press-loop-clean
