name: Repair checks branch

on:
  push:
    branches:
      - fix/mqs-react-hooks-refs

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair source and formatting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pages/MqsPrototype.tsx")
          text = path.read_text()

          render_write = "\n  latestItemIdRef.current = item.id\n\n  function clearLoopHold"
          if text.count(render_write) != 1:
              raise SystemExit("Expected one MQS render-time item ref write")
          text = text.replace(render_write, "\n  function clearLoopHold", 1)

          effect_start = (
              "  React.useEffect(() => {\n"
              "    if (previousItemIdRef.current === item.id) return\n"
          )
          if text.count(effect_start) != 1:
              raise SystemExit("Expected one MQS item-change effect")
          text = text.replace(
              effect_start,
              "  React.useEffect(() => {\n"
              "    latestItemIdRef.current = item.id\n"
              "    if (previousItemIdRef.current === item.id) return\n",
              1,
          )

          path.write_text(text)
          PY

          pnpm exec prettier --write \
            src/pages/Catalog.tsx \
            src/pages/Landing.tsx \
            src/pages/MqsPrototype.tsx
          git diff --check

      - name: Commit repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Catalog.tsx src/pages/Landing.tsx src/pages/MqsPrototype.tsx
          git diff --cached --exit-code && exit 0
          git commit -m "fix: restore repository checks [repair]"
          git push origin HEAD:fix/mqs-react-hooks-refs

      - name: Verify lint and types
        run: |
          pnpm lint
          pnpm typecheck
