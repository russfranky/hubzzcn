name: Apply MQS Modal Integrity

on:
  push:
    branches:
      - feature/mqs-modal-state-integrity
    paths:
      - ".github/workflows/apply-mqs-modal-integrity-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/mqs-modal-state-integrity
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply modal integrity patch
        run: python .github/scripts/apply-mqs-modal-integrity.py

      - name: Make host-height flex direction explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/pages/MqsPrototype.tsx")
          source = source_path.read_text()
          source = source.replace(
              'className="dark flex h-dvh min-h-0 bg-background',
              'className="dark flex h-dvh min-h-0 flex-col bg-background',
              1,
          )
          source_path.write_text(source)

          css_path = Path("src/index.css")
          css = css_path.read_text()
          css = css.replace(
              'main:has(#now-playing-title) {\n  display: flex;\n  height: 100dvh;',
              'main:has(#now-playing-title) {\n  display: flex;\n  height: 100dvh;\n  flex-direction: column;',
              1,
          )
          css_path.write_text(css)
          PY

      - name: Format changed files
        run: pnpm exec prettier --write src/pages/MqsPrototype.tsx src/index.css tests/mqs-prototype.spec.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run MQS browser tests
        run: pnpm exec playwright test tests/mqs-prototype.spec.ts --project=chromium

      - name: Commit feature and remove temporary patch files
        run: |
          rm .github/workflows/apply-mqs-modal-integrity-once.yml
          rm .github/scripts/apply-mqs-modal-integrity.py
          git config user.name "Russfranky"
          git config user.email "90220424+russfranky@users.noreply.github.com"
          git add src/pages/MqsPrototype.tsx src/index.css tests/mqs-prototype.spec.ts .github/workflows/apply-mqs-modal-integrity-once.yml .github/scripts/apply-mqs-modal-integrity.py
          git commit -m "fix: stabilize MQS modal state geometry"
          git push origin HEAD:feature/mqs-modal-state-integrity
