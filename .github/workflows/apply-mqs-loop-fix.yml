name: Apply MQS loop interaction fix

on:
  push:
    branches:
      - fix/mqs-long-press-loop
    paths:
      - .github/workflows/apply-mqs-loop-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mqs-long-press-loop
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: python scripts/apply_mqs_loop_fix.py
      - run: pnpm exec prettier --write src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts

      - name: Commit fix and remove helper files
        shell: bash
        run: |
          rm scripts/apply_mqs_loop_fix.py
          rm .github/workflows/apply-mqs-loop-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts scripts/apply_mqs_loop_fix.py .github/workflows/apply-mqs-loop-fix.yml
          git commit -m "fix: harden MQS loop long press"
          git push origin HEAD:fix/mqs-long-press-loop
