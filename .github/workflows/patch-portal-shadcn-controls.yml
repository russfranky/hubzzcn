name: Patch Portal shadcn control sizing

on:
  push:
    branches:
      - demo/portal-shadcn-search-filter-sizing

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: demo/portal-shadcn-search-filter-sizing
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply shadcn control parity patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/PortalPrototype.tsx')
          text = path.read_text()

          marker = 'const FLOOR_GRADIENTS = ['
          input_primitive = '''const PROFILE_PANEL_INPUT =\n  "h-8 w-full min-w-0 rounded-lg border border-input bg-transparent px-2.5 py-1 text-base transition-colors outline-none file:inline-flex file:h-6 file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 disabled:pointer-events-none disabled:cursor-not-allowed disabled:bg-input/50 disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 md:text-sm dark:bg-input/30 dark:disabled:bg-input/80 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40"\n\nfunction ProfilePanelInput({\n  className,\n  type,\n  ...props\n}: React.ComponentProps<"input">) {\n  return (\n    <input\n      type={type}\n      data-slot="input"\n      className={cn(PROFILE_PANEL_INPUT, className)}\n      {...props}\n    />\n  )\n}\n\n'''
          if marker not in text:
              raise SystemExit('FLOOR_GRADIENTS marker not found')
          text = text.replace(marker, input_primitive + marker, 1)

          old = '''        <label className="flex min-w-0 flex-1 items-center gap-3 rounded-[60px] bg-card px-4 py-3">\n          <Search\n            className="size-5 shrink-0 text-[#fcfdfe]"\n            aria-hidden="true"\n          />\n          <input\n            type="search"\n            value={query}\n            onChange={(event) => onQueryChange(event.target.value)}\n            placeholder="Search spaces"\n            aria-label="Search spaces"\n            className="min-w-0 flex-1 border-none bg-transparent p-0 text-[14px] leading-[20px] font-normal text-[#fcfdfe] outline-none placeholder:text-[#adbac5]"\n          />\n        </label>\n\n        <div className="relative shrink-0">\n          <button\n            type="button"\n            aria-label="Filter spaces"\n            aria-expanded={filterOpen}\n            onClick={() => setFilterOpen((open) => !open)}\n            className="flex size-11 items-center justify-center rounded-full border-none bg-card text-[#fcfdfe] shadow-[0px_16px_16px_-4px_rgba(0,0,0,0.1)] transition-colors hover:bg-muted"\n          >\n            <ListFilter className="size-5" />\n          </button>\n'''
          new = '''        <div className="relative min-w-0 flex-1">\n          <Search\n            className="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2 text-muted-foreground"\n            aria-hidden="true"\n          />\n          <ProfilePanelInput\n            type="search"\n            value={query}\n            onChange={(event) => onQueryChange(event.target.value)}\n            placeholder="Search spaces"\n            aria-label="Search spaces"\n            className="pl-9 text-sm"\n          />\n        </div>\n\n        <div className="relative shrink-0">\n          <ProfilePanelButton\n            type="button"\n            size="icon"\n            aria-label="Filter spaces"\n            aria-expanded={filterOpen}\n            onClick={() => setFilterOpen((open) => !open)}\n            className="rounded-full bg-white/5 text-foreground hover:bg-white/10 hover:text-foreground"\n          >\n            <ListFilter className="size-4" />\n          </ProfilePanelButton>\n'''
          if old not in text:
              raise SystemExit('custom search/filter block not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - run: pnpm exec prettier --write src/pages/PortalPrototype.tsx
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PortalPrototype.tsx
          git commit -m "Use pre-alpha shadcn sizing for Portal controls"
          git push
