name: MQS format evidence

on:
  push:
    branches:
      - ops/mqs-reorder-format

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture exact formatting and check source
        run: |
          pnpm exec prettier --write tests/mqs-reorder.spec.ts
          git diff -- tests/mqs-reorder.spec.ts
          pnpm lint
          pnpm typecheck
          mkdir -p format-evidence/plugins
          cp tests/mqs-reorder.spec.ts format-evidence/
          cp node_modules/prettier/standalone.mjs format-evidence/
          cp node_modules/prettier/plugins/typescript.mjs format-evidence/plugins/
          cp node_modules/prettier/plugins/estree.mjs format-evidence/plugins/
      - name: Save format evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mqs-format-evidence
          path: format-evidence/
          retention-days: 1
