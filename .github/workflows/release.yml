name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import pkg from "./package.json" with { type: "json" };
            const expected = `v${pkg.version}`;
            if (process.env.RELEASE_TAG !== expected) {
              console.error(`Tag ${process.env.RELEASE_TAG} does not match package version ${expected}`);
              process.exit(1);
            }
          '

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run repository checks
        run: npm run check

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npm run test:ui

      - name: Verify tagged registry base
        run: npx --yes shadcn@latest view "russfranky/hubzzcn/hubzz#${GITHUB_REF_NAME}" >/dev/null

      - name: Pack package artifact
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/*.tgz --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
