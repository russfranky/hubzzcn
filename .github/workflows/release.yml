name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import pkg from "./package.json" with { type: "json" };
            const expected = `v${pkg.version}`;
            if (process.env.RELEASE_TAG !== expected) {
              console.error(`Tag ${process.env.RELEASE_TAG} does not match package version ${expected}`);
              process.exit(1);
            }
          '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify registry dependency refs
        run: pnpm release:verify-registry "${GITHUB_REF_NAME}"

      - name: Run repository checks
        run: pnpm check

      - name: Install supported browsers
        run: pnpm exec playwright install chromium firefox webkit --with-deps

      - name: Run browser and accessibility tests
        run: pnpm test:ui

      - name: Verify every tagged registry item
        shell: bash
        run: |
          set -euo pipefail
          items_file="${RUNNER_TEMP}/hubzz-registry-items"
          pnpm exec tsx scripts/list-registry-items.ts > "$items_file"

          while IFS= read -r item; do
            echo "Resolving ${item} at ${GITHUB_REF_NAME}"
            pnpm exec shadcn view \
              "russfranky/hubzzcn/${item}#${GITHUB_REF_NAME}" >/dev/null
          done < "$items_file"

      - name: Verify tagged registry in a clean consumer
        run: pnpm registry:smoke "${GITHUB_REF_NAME}"

      - name: Pack release artifact
        run: |
          mkdir -p release-assets
          pnpm pack --pack-destination release-assets
          (cd release-assets && sha256sum *.tgz > SHA256SUMS)

      - name: Attest release artifact provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/*.tgz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/*.tgz \
            release-assets/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
