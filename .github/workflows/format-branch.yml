name: Normalize review branch

on:
  push:
    branches:
      - migration
    paths:
      - ".github/workflows/format-branch.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: migration

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Normalize source and generated docs
        run: |
          pnpm format
          pnpm generate:manifest
          pnpm format

      - name: Commit normalized source
        run: |
          git config user.name "Russfranky"
          git config user.email "90220424+russfranky@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: normalize public registry source"
          git push origin HEAD:migration
