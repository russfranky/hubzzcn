name: Apply MQS QoL Once

on:
  push:
    branches:
      - feature/mqs-qol-tweaks

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply MQS QoL patch
        run: python .github/scripts/apply-mqs-qol.py

      - name: Format changed files
        run: pnpm exec prettier --write src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run MQS browser tests
        run: pnpm exec playwright test tests/mqs-prototype.spec.ts --project=chromium

      - name: Commit feature and remove temporary patch files
        run: |
          set -euo pipefail
          git config user.name "Russfranky"
          git config user.email "90220424+russfranky@users.noreply.github.com"
          git rm .github/scripts/apply-mqs-qol.py .github/workflows/apply-mqs-qol-once.yml
          git add src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts
          git commit -m "feat: add MQS quality-of-life interactions"
          git push origin HEAD:feature/mqs-qol-tweaks
