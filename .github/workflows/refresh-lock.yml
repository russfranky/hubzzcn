name: Refresh npm lockfile

on:
  push:
    branches:
      - migration
    paths:
      - ".github/workflows/refresh-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: migration

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Regenerate and verify lockfile
        run: |
          set -euo pipefail
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit verified lockfile
        run: |
          git config user.name "Russfranky"
          git config user.email "90220424+russfranky@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate verified npm lockfile"
          git push origin HEAD:migration
