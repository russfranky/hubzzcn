name: Bootstrap pnpm lockfile

on:
  push:
    branches:
      - migration
    paths:
      - ".github/workflows/refresh-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: migration

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate and verify pnpm lockfile
        run: |
          set -euo pipefail
          rm -f package-lock.json pnpm-lock.yaml
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      - name: Commit verified pnpm lockfile
        run: |
          git config user.name "Russfranky"
          git config user.email "90220424+russfranky@users.noreply.github.com"
          git add -A package-lock.json pnpm-lock.yaml
          git commit -m "chore: adopt pnpm lockfile"
          git push origin HEAD:migration
