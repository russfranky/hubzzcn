name: Apply clean MQS loop patch

on:
  push:
    branches:
      - feat/mqs-long-press-loop-clean
    paths:
      - .github/workflows/apply-mqs-loop-clean.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mqs-long-press-loop-clean
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/apply_mqs_loop_clean.py
      - run: pnpm exec prettier --write src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts
      - name: Commit clean implementation and remove helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts
          git rm scripts/apply_mqs_loop_clean.py .github/workflows/apply-mqs-loop-clean.yml
          git commit -m "feat: add clean MQS long-press loop"
          git push origin HEAD:feat/mqs-long-press-loop-clean
