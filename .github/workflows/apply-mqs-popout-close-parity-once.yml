name: Apply MQS Popout Close Parity Once

on:
  push:
    branches:
      - feature/mqs-popout-close-parity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: python scripts/tmp-mqs-popout-close-parity.py
      - run: pnpm exec prettier --write src/pages/MqsPrototype.tsx src/index.css tests/mqs-prototype.spec.ts
      - run: pnpm typecheck
      - run: pnpm exec playwright install chromium
      - run: pnpm exec playwright test tests/mqs-prototype.spec.ts --project=chromium

      - name: Commit feature and remove temporary files
        run: |
          rm -f scripts/tmp-mqs-popout-close-parity.py
          rm -f .github/workflows/apply-mqs-popout-close-parity-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/pages/MqsPrototype.tsx src/index.css tests/mqs-prototype.spec.ts scripts .github/workflows
          if git diff --cached --quiet; then
            echo "No feature changes to commit"
          else
            git commit -m "fix: match MQS popout close behavior"
            git push origin HEAD:feature/mqs-popout-close-parity
          fi
