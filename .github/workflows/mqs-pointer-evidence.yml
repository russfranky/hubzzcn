name: Verify MQS pointer actions live

on:
  push:
    branches:
      - ops/mqs-pointer-verification

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested merge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: f05b5f01c06a47794be27dc584a13d5d66fed61e
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies and browsers
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium firefox webkit --with-deps
      - name: Test all MQS suites on the live site
        run: |
          mkdir -p live-evidence
          cat > playwright.live.config.ts <<'TS'
          import { defineConfig, devices } from '@playwright/test';
          export default defineConfig({
            testDir: './tests',
            testMatch: /(?:mqs-prototype|mqs-reorder|mqs-state|mqs-pointer)\.spec\.ts/,
            forbidOnly: true,
            retries: 0,
            workers: 1,
            reporter: [['list'], ['json', { outputFile: 'live-evidence/tests.json' }]],
            use: {
              baseURL: 'https://hubzz-ui-phi.vercel.app',
              screenshot: 'only-on-failure',
              trace: 'retain-on-failure',
            },
            projects: [
              { name: 'chromium', use: { ...devices['Desktop Chrome'] } },
              { name: 'firefox', use: { ...devices['Desktop Firefox'] } },
              { name: 'webkit', use: { ...devices['Desktop Safari'] } },
            ],
          });
          TS
          pnpm exec playwright test --config=playwright.live.config.ts
      - name: Capture pointer action panels and dismissal
        if: always()
        run: |
          mkdir -p live-evidence
          node --input-type=module <<'JS'
          import { chromium, expect } from '@playwright/test';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch();
          const results = [];
          try {
            for (const [name, viewport] of [['desktop', { width: 1280, height: 900 }], ['narrow', { width: 320, height: 720 }], ['short', { width: 320, height: 240 }]]) {
              const page = await browser.newPage({ viewport, hasTouch: true, reducedMotion: 'reduce' });
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              const response = await page.goto('https://hubzz-ui-phi.vercel.app/?prototype=mqs', { waitUntil: 'networkidle', timeout: 30000 });
              expect(response?.status()).toBe(200);
              await expect(page.getByRole('list', { name: 'Media queue items' }).getByRole('listitem')).toHaveCount(5);
              await page.getByRole('button', { name: 'Reorder item 3', exact: true }).tap();
              const panel = page.getByRole('dialog', { name: 'Reorder item 3', exact: true });
              await expect(panel).toBeInViewport({ ratio: 1 });
              await page.screenshot({ path: `live-evidence/actions-${name}.png`, fullPage: true, animations: 'disabled' });
              await writeFile(`live-evidence/actions-${name}.txt`, await page.locator('body').ariaSnapshot());
              const bounds = await panel.boundingBox();
              await panel.getByRole('button', { name: 'Move to end', exact: true }).tap();
              await expect(page.getByTestId('last-mqs-command')).toHaveText('--move 3 5');
              await expect(page.getByRole('dialog')).toHaveCount(0);
              await expect(page.getByRole('button', { name: 'Reorder item 5', exact: true })).toBeFocused();
              await expect(page.getByTestId('current-row')).toContainText('Tomorrowland 2026 Mainstage W1');
              expect(await page.evaluate(() => document.documentElement.scrollWidth <= window.innerWidth)).toBe(true);
              expect(errors).toEqual([]);
              results.push({ name, viewport, status: response.status(), panelBounds: bounds, errors });
              await page.close();
            }
          } finally { await browser.close(); }
          await writeFile('live-evidence/browser.json', JSON.stringify({ sourceCommit: 'f05b5f01c06a47794be27dc584a13d5d66fed61e', results }, null, 2));
          JS
      - name: Save live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mqs-pointer-live-evidence
          path: |
            live-evidence/
            test-results/
          retention-days: 7
