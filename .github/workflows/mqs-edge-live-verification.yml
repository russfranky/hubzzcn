name: Verify MQS error feedback live

on:
  push:
    branches:
      - ops/mqs-edge-live-verification

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested merge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9001726ec355a4287c9188f1e7e28fcb2f90e305
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium --with-deps
      - name: Verify settled error feedback in both motion modes
        run: |
          mkdir -p live-error-evidence
          node --input-type=module <<'JS'
          import { chromium, expect } from '@playwright/test';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch();
          const results = [];
          try {
            for (const reducedMotion of ['no-preference', 'reduce']) {
              for (const [name, viewport] of [['desktop', { width: 1280, height: 900 }], ['narrow', { width: 320, height: 720 }]]) {
                const page = await browser.newPage({ viewport, reducedMotion });
                const errors = [];
                page.on('pageerror', error => errors.push(error.message));
                const response = await page.goto('https://hubzz-ui-phi.vercel.app/?prototype=mqs', { waitUntil: 'networkidle', timeout: 30000 });
                expect(response?.status()).toBe(200);
                const rows = page.getByRole('list', { name: 'Media queue items' }).getByRole('listitem');
                await expect(rows).toHaveCount(5);
                const original = await rows.allTextContents();
                await page.getByLabel('Setlist JSON file').setInputFiles({ name: 'invalid.json', mimeType: 'application/json', buffer: Buffer.from('{') });
                const message = page.getByText('Could not load setlist', { exact: true });
                await expect(message).toBeVisible();
                const notification = page.locator('[data-sonner-toast]').filter({ has: message });
                // Visibility alone permits a toast still outside the viewport during entrance.
                await expect(notification).toBeInViewport({ ratio: 1 });
                await expect.poll(() => notification.evaluate(element => Number(getComputedStyle(element).opacity))).toBe(1);
                await expect(rows).toHaveText(original);
                const file = `mqs-${name}-${reducedMotion}-error`;
                await page.screenshot({ path: `live-error-evidence/${file}.png`, fullPage: true, animations: 'disabled' });
                await writeFile(`live-error-evidence/${file}.txt`, await page.locator('body').ariaSnapshot());
                const bounds = await notification.boundingBox();
                expect(errors).toEqual([]);
                results.push({ name, reducedMotion, status: response.status(), notificationBounds: bounds, errors });
                await page.close();
              }
            }
          } finally { await browser.close(); }
          await writeFile('live-error-evidence/browser.json', JSON.stringify({ sourceCommit: '9001726ec355a4287c9188f1e7e28fcb2f90e305', results }, null, 2));
          JS
      - name: Save settled error evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mqs-settled-error-evidence
          path: live-error-evidence/
          retention-days: 7
