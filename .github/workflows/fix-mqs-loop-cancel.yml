name: Fix MQS loop hold cancel

on:
  push:
    branches:
      - feat/mqs-long-press-loop-clean
    paths:
      - .github/workflows/fix-mqs-loop-cancel.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mqs-long-press-loop-clean
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/fix_mqs_loop_cancel.py
      - run: pnpm exec prettier --write src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts
      - name: Commit fix and remove helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MqsPrototype.tsx tests/mqs-prototype.spec.ts
          git rm scripts/fix_mqs_loop_cancel.py .github/workflows/fix-mqs-loop-cancel.yml
          git commit -m "fix: clear canceled MQS loop holds cleanly"
          git push origin HEAD:feat/mqs-long-press-loop-clean
